version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: investlearn-db
    restart: always
    environment:
      POSTGRES_USER: investlearn
      POSTGRES_PASSWORD: ${DB_PASSWORD:-investlearn123}
      POSTGRES_DB: investlearn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investlearn"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: investlearn-redis
    restart: always
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: investlearn-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://investlearn:${DB_PASSWORD:-investlearn123}@db:5432/investlearn
      REDIS_URL: redis://redis:6379/0
      ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-jwt}
      CORS_ORIGINS: '["*"]'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-vl-plus}
      CRAWLER_HTTP_TIMEOUT: ${CRAWLER_HTTP_TIMEOUT:-30.0}
      CRAWLER_RETRY_MAX: ${CRAWLER_RETRY_MAX:-3}
      CRAWLER_RETRY_DELAY: ${CRAWLER_RETRY_DELAY:-2.0}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      GENERATE_FAKE_CONTENT: ${GENERATE_FAKE_CONTENT:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: investlearn-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
